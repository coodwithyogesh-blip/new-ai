name: Build and Publish Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Prepare release signing
        shell: bash
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.JARVIS_RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.JARVIS_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.JARVIS_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.JARVIS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${RELEASE_KEYSTORE_B64:-}" && -n "${RELEASE_STORE_PASSWORD:-}" && -n "${RELEASE_KEY_ALIAS:-}" && -n "${RELEASE_KEY_PASSWORD:-}" ]]; then
            echo "${RELEASE_KEYSTORE_B64}" | base64 --decode > "${RUNNER_TEMP}/jarvis-release.jks"
            echo "Using configured persistent release keystore."
          else
            echo "No persistent release keystore configured; creating an ephemeral release key for this build."
            keytool -genkeypair -v -keystore "${RUNNER_TEMP}/jarvis-release.jks" -storepass "jarvis-temp-store" -alias "jarvis-release" -keypass "jarvis-temp-key" -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=JARVIS AI,O=JARVIS,C=IN"
            RELEASE_STORE_PASSWORD="jarvis-temp-store"; RELEASE_KEY_ALIAS="jarvis-release"; RELEASE_KEY_PASSWORD="jarvis-temp-key"
          fi
          echo "JARVIS_KEYSTORE_PATH=${RUNNER_TEMP}/jarvis-release.jks" >> "${GITHUB_ENV}"
          echo "JARVIS_KEYSTORE_PASSWORD=${RELEASE_STORE_PASSWORD}" >> "${GITHUB_ENV}"
          echo "JARVIS_KEY_ALIAS=${RELEASE_KEY_ALIAS}" >> "${GITHUB_ENV}"
          echo "JARVIS_KEY_PASSWORD=${RELEASE_KEY_PASSWORD}" >> "${GITHUB_ENV}"
      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace --no-daemon
      - name: Verify APK and signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          ls -lh "$APK"
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Prepare release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          ASSET_DIR="$(mktemp -d -t jarvis-release-XXXXXX)"
          FILENAME="jarvis-ai-release-build-${{ github.run_number }}.apk"
          cp "app/build/outputs/apk/release/app-release.apk" "${ASSET_DIR}/${FILENAME}"
          test -s "${ASSET_DIR}/${FILENAME}"
          echo "release_asset_path=${ASSET_DIR}/${FILENAME}" >> "${GITHUB_OUTPUT}"
          echo "release_filename=${FILENAME}" >> "${GITHUB_OUTPUT}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="release-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="JARVIS AI Release APK #${{ github.run_number }}"
          gh release create "$TAG" "${{ steps.prepare_asset.outputs.release_asset_path }}" --title "$TITLE" --notes "Release-signed JARVIS AI APK. Universal App Control remains enabled. Configure persistent signing secrets for stable update signing." --target "${{ github.sha }}" --latest
      - name: Build summary
        if: always()
        run: |
          echo "Release APK build completed." >> "${GITHUB_STEP_SUMMARY}"
          echo "Signature verified with apksigner." >> "${GITHUB_STEP_SUMMARY}"